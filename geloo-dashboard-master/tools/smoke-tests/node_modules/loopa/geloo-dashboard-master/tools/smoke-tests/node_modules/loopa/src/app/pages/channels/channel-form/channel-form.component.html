<app-header title="New Channel" [back]="true"></app-header>

<ion-content class="pro-form-content">
  <app-loader *ngIf="pageLoading"></app-loader>
  
  <div *ngIf="!pageLoading" class="pro-container">
    <!-- Professional Image Header -->
    <div (click)="pickImage()" class="image-header" [class.has-img]="channelImage.url">
      <div *ngIf="!channelImage.url" class="upload-state">
        <div class="upload-icon">
          <i class="fas" [class.fa-plus]="!imageLoading" [class.fa-circle-notch]="imageLoading" [class.fa-spin]="imageLoading"></i>
        </div>
        <span class="label">{{ imageLoading ? 'Processing...' : 'Add Channel Cover' }}</span>
      </div>
      <img *ngIf="channelImage.url" [src]="channelImage.url" class="header-img" alt="">
      <div class="img-overlay" *ngIf="channelImage.url">
        <button class="edit-btn"><i class="fas fa-camera"></i></button>
      </div>
    </div>

    <form [formGroup]="form" class="pro-form">
      <div class="form-section">
        <div class="field-box">
          <span class="field-label">Channel Name</span>
          <ion-input formControlName="name" placeholder="Enter name..."></ion-input>
          <div class="error-msg" *ngIf="validatorErrors['name'] || (name.dirty && name.errors)">
            <span *ngIf="name.hasError('required')">Required</span>
            <span *ngIf="name.hasError('maxlength')">Too long</span>
          </div>
        </div>

        <div class="field-box">
          <span class="field-label">Category</span>
          <ion-input formControlName="category" placeholder="e.g. Technology"></ion-input>
          <div class="error-msg" *ngIf="validatorErrors['category'] || (category.dirty && category.errors)">
            <span *ngIf="category.hasError('required')">Required</span>
          </div>
        </div>

        <div class="field-box">
          <span class="field-label">Description</span>
          <ion-textarea 
            maxlength="255" 
            formControlName="description" 
            rows="3" 
            placeholder="Tell us about this channel...">
          </ion-textarea>
          <div class="error-msg" *ngIf="validatorErrors['description'] || (description.dirty && description.errors)">
            <span *ngIf="description.hasError('required')">Required</span>
          </div>
        </div>
      </div>

      <!-- Terms & Conditions -->
      <div class="terms-wrapper" (click)="presentTermsModal()">
        <div class="terms-check" [class.checked]="termsAccepted">
          <i class="fas fa-check" *ngIf="termsAccepted"></i>
        </div>
        <div class="terms-text">
          I agree to the <span>Terms & Conditions</span>
        </div>
      </div>
    </form>

    <!-- Hidden File Input for Browser Fallback -->
    <input type="file" #fileInput (change)="onFileSelected($event)" style="display: none;" accept="image/*">

    <div class="pro-footer-inline">
      <button 
        class="pro-submit-btn"
        (click)="submit()"
        [disabled]="!form.valid || !termsAccepted || !channelImage.file"
      >
        Create Channel
      </button>
    </div>
  </div>
</ion-content>
