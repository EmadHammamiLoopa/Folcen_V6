<app-header title="Find New Friends">
  <div id="end-buttons">
    <ion-button fill="clear" shape="round" (click)="presentSearchByModal()" class="glass-action-btn">
      <ion-icon name="filter" slot="icon-only"></ion-icon>
    </ion-button>
  </div>
</app-header>

<ion-content class="vibrant-dark-theme">
  <div class="mesh-gradient"></div>

  <div class="discovery-container">
    <div class="mode-toggle-card glass-card animate__animated animate__fadeInDown">
      <ion-item lines="none" class="mode-toggle">
        <ion-label class="toggle-label">Random Discovery</ion-label>
        <ion-toggle [(ngModel)]="random" (ionChange)="toggleRandom()"></ion-toggle>
      </ion-item>
    </div>

    <app-loader *ngIf="pageLoading" class="animated-loader"></app-loader>

    <ion-refresher *ngIf="!random" slot="fixed" pullFactor="0.5" pullMin="100" pullMax="200" (ionRefresh)="getNearUsers($event, true)">
      <ion-refresher-content pullingIcon="lines" refreshingSpinner="crescent"></ion-refresher-content>
    </ion-refresher>

    <div class="content-wrapper" *ngIf="!pageLoading && users && users.length">
      <!-- Random Swipe Mode -->
      <ion-slides #slides *ngIf="random" class="swipe-mode h-100" pager="false" [options]="slideOpts">
        <ion-slide class="h-100 swiper-no-swiping" *ngFor="let user of users; let last = last">
          <ng-container *ngIf="isUser(user)">
            <app-slide
              (onRefresh)="getNearUsers(null, true)"
              [last]="last"  
              (onSkip)="skipSlide()"
              [authUser]="authUser"
              [random]="random"
              [user]="user">
            </app-slide>
          </ng-container>
        </ion-slide>
      </ion-slides>

      <!-- Grid View Mode -->
      <div *ngIf="!random" class="grid-mode">
        <div class="user-grid">
          <ng-container *ngFor="let user of users; let i = index">
            <div class="user-card-wrapper animate__animated animate__fadeInUp" 
                 [style.animation-delay]="(i * 0.05) + 's'"
                 *ngIf="isUser(user)">
              <div class="user-card glass-card" (click)="showProfile(user.id)">
                <div class="photo-container">
                  <img [src]="user.mainAvatar || user.avatar[0]" alt="Avatar">
                  <div class="status-dot" [class.online]="user.online"></div>
                </div>
                <div class="user-info">
                  <h3 class="user-name">{{ user.firstName | resumeText: 12 }}</h3>
                  <p class="user-age" *ngIf="user.getAge(true)">{{ user.getAge(true) }} yrs</p>
                </div>
              </div>
            </div>

            <div class="discovery-message-wrapper" *ngIf="!isUser(user) && authUser?.country">
              <div class="discovery-message glass-card">
                <div class="icon-box">
                  <i class="fas fa-globe-americas"></i>
                </div>
                <h2 *ngIf="user.scope === 'country'">Discover more friends from {{ authUser.country }}!</h2>
                <h2 *ngIf="user.scope === 'global' || isGlobalSearch">Explore friends around the world!</h2>
                <h2 *ngIf="!user.scope && !isGlobalSearch">Discover more friends in your area!</h2>
              </div>
            </div>
          </ng-container>
        </div>
      </div>
    </div>

    <div class="empty-state animate__animated animate__fadeIn" *ngIf="!pageLoading && !hasRealUsers()">
      <div class="empty-icon">
        <i class="fas fa-users-slash"></i>
      </div>
      <h2>No matches found</h2>
      <p>Try adjusting your search filters or check back later</p>
      <button class="adjust-btn" (click)="presentSearchByModal()">Adjust Filters</button>
    </div>

    <ion-infinite-scroll #infinitScroll threshold="100px" (ionInfinite)="getNearUsers($event, false)">
      <ion-infinite-scroll-content loadingSpinner="crescent"></ion-infinite-scroll-content>
    </ion-infinite-scroll>
  </div>

  <!-- Floating Filter Button for Random Mode -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed" *ngIf="random">
    <ion-fab-button (click)="presentSearchByModal()" class="glass-fab">
      <ion-icon name="options-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
