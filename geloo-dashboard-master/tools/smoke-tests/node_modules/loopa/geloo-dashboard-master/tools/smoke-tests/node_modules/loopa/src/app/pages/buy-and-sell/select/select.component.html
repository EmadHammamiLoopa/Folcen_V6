<app-header [menu]="true" title="Marketplace"></app-header>

<ion-content class="vibrant-dark-theme">
  <div class="mesh-gradient"></div>

  <div class="select-container animate__animated animate__fadeIn">
    <div class="hero-section">
      <div class="icon-badge">
        <i class="fas fa-shopping-bag"></i>
      </div>
      <h1>Marketplace</h1>
      <p>Buy unique items or sell your own products to the community.</p>
    </div>

    <div class="options-grid">
      <!-- Buyer Card -->
      <div class="option-card buyer animate__animated animate__fadeInLeft" routerLink="/tabs/buy-and-sell/products/buy">
        <div class="card-glass"></div>
        <div class="card-content">
          <div class="card-icon">
            <i class="fas fa-shopping-cart"></i>
          </div>
          <h2>I want to Buy</h2>
          <p>Browse categories, find deals, and discover amazing products.</p>
          <div class="card-footer">
            <span>Explore Shop</span>
            <i class="fas fa-arrow-right"></i>
          </div>
        </div>
      </div>

      <!-- Seller Card -->
      <div class="option-card seller animate__animated animate__fadeInRight" routerLink="/tabs/buy-and-sell/products/sell">
        <div class="card-glass"></div>
        <div class="card-content">
          <div class="card-icon">
            <i class="fas fa-store"></i>
          </div>
          <h2>I want to Sell</h2>
          <p>List your items, manage your inventory, and reach buyers.</p>
          <div class="card-footer">
            <span>Start Selling</span>
            <i class="fas fa-arrow-right"></i>
          </div>
        </div>
      </div>
    </div>
  </div>
</ion-content>
