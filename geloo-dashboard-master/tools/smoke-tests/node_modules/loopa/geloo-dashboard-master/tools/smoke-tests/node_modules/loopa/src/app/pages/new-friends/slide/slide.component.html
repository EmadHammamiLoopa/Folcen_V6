<div class="slide-container animate__animated animate__fadeIn">
  <div class="image-wrapper">
    <img (click)="!random ? showProfile() : null" [src]="avatarUrl" class="user-image" alt="">
    
    <div class="glass-overlay p-3" (click)="!random ? showProfile() : null">
      <div class="user-info">
        <h2 class="user-name">
          {{ user.fullName }}<span class="age" *ngIf="user.getAge(true)">, {{ user.getAge(true) }}</span>
          <span class="online-status" *ngIf="user.online"></span>
        </h2>
        <p class="user-location">
          <i class="fas fa-map-marker-alt"></i>
          {{ user.gender }}, {{ user.city }}
        </p>
      </div>
    </div>
  </div>

  <div class="actions-container">
    <div class="action-buttons">
      <button *ngIf="random" class="glass-btn video" (click)="videoCall()">
        <i class="fas fa-video"></i>
      </button>

      <button *ngIf="!last" class="glass-btn skip" (click)="onSkip.emit()">
        <i class="fas fa-times"></i>
      </button>

      <button *ngIf="last" class="glass-btn refresh" (click)="onRefresh.emit()">
        <i class="fas fa-sync-alt"></i>
      </button>

      <button *ngIf="random" class="glass-btn chat" (click)="navigateTo('/messages/chat/' + user.id)">
        <i class="fas fa-comments"></i>
      </button>
    </div>
  </div>
</div>
