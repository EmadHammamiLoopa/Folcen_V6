<div class="container-fluid">
  <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mx-4 my-4" *ngIf="error">
    <p class="font-bold">Server error</p>
    <p>Something not ideal might be happening.</p>
  </div>

  <app-form
    [headers]="headers"
    plurarName="Channels"
    singleName="channel"
    icon="fas fa-project-diagram"
    redirectLink="/dashboard/Channels/list"
    retrieveURL="channel/:id"
    storeURL="channel/"
    updateURL="channel/:id"
    (headersChanged)="changeHeaders($event)"
    (onChange)="fieldChanged($event)"
  ></app-form>
</div>
