<app-header title="Social Hub" [menu]="true">
  <div id="end-buttons">
    <div class="header-action-wrapper">
      <ion-button fill="clear" shape="round" routerLink="/tabs/messages" class="glass-action-btn">
        <i class="far fa-comments"></i>
      </ion-button>
      <ng-container *ngIf="(messagesCount$ | async) as m">
        <div class="vibrant-badge" *ngIf="m > 0">{{ m }}</div>
      </ng-container>
    </div>
  </div>
</app-header>

<div class="social-tabs-container">
  <div class="glass-tabs">
    <div class="tab-item" routerLink="/tabs/friends/list" routerLinkActive="active">
      <i class="fas fa-user-friends"></i>
      <span>Friends</span>
    </div>
    
    <div class="tab-item" routerLink="/tabs/friends/requests" routerLinkActive="active">
      <div class="request-icon-wrapper">
        <i class="fas fa-user-plus"></i>
        <ng-container *ngIf="(friendRequestsCount$ | async) as fr2">
          <div class="dot-badge" *ngIf="fr2 > 0"></div>
        </ng-container>
      </div>
      <span>Requests</span>
      <ng-container *ngIf="(friendRequestsCount$ | async) as fr2">
        <span class="count-text" *ngIf="fr2 > 0">({{ fr2 }})</span>
      </ng-container>
    </div>
  </div>
</div>
