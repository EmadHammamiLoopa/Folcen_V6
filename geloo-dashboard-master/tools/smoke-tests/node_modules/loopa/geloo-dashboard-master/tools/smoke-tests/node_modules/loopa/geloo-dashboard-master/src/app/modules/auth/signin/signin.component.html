<div class="grid grid-cols-12 h-full">
  <div class="col-span-5 bg-black text-white text-center grid grid-cols-12 items-center">
    <div class="border-b-2 pb-4 border-grey-200 col-span-6 col-start-4">
      <span class="font-bold">
        <span class="text-6xl"><i class="fas fa-th"></i></span>
        <span class="text-5xl mt-2">Geloo Dashboard</span>
      </span>
      <span class="text-2xl mt-2">Break the ice</span>
    </div>
  </div>
  
  <div class="col-span-7 text-center grid grid-cols-12 items-center">
    <div class="border-b-2 pb-4 border-grey-200 col-span-6 col-start-4 text-center justify-center">
      <img class="w-16 mx-auto" src="./../../../../assets/logo.png" alt="">
      <span class="text-2xl font-bold">Login</span>
      <form #form="ngForm" (ngSubmit)="submit(form.value)">
        <div class="mt-4">
          <app-alert [title]="error" *ngIf="error" type="danger" ></app-alert>
        </div>
        <input 
          ngModel 
          name="email" 
          type="email" 
          class="appearance-none mt-5 block w-full bg-gray-100 text-gray-600 rounded py-3 px-4 leading-tight focus:outline-none focus:bg-white"
          id="email" 
          placeholder="name@example.com"
        >
        <span class="text-red-400 my-2 text-left" *ngIf="errors && errors['email']">
          <span *ngFor="let error of errors['email']">
            <i class="fas fa-info-circle mx-1"></i>{{ error }}
          </span>
        </span>

        <input 
          ngModel 
          name="password" 
          type="password" 
          class="appearance-none mt-5 block w-full bg-gray-100 text-gray-600 rounded py-3 px-4 leading-tight focus:outline-none focus:bg-white"
          id="password" 
          placeholder="Password"
        >
        <span class="text-red-400 my-2 text-left" *ngIf="errors && errors['password']">
          <span *ngFor="let error of errors['password']">
            <i class="fas fa-info-circle mx-1"></i>{{ error }}
          </span>
        </span>

        <button type="submit" class="bg-indigo-400 p-2 w-full mt-5 text-white">
          <span *ngIf="loading"><i class="fas fa-circle-notch fa-spin"></i></span>
          <span *ngIf="!loading">Log in</span>
        </button>
      </form>
    </div>
  </div>
</div>
