<div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mx-4 my-4" *ngIf="error">
  <p class="font-bold">Server error</p>
  <p>Something not ideal might be happening.</p>
</div>
<app-form
    [headers]="headers"
    plurarName="subscriptions"
    singleName="subscription"
    icon="fas fa-money-check-alt"
    redirectLink="/dashboard/subscriptions/list"
    retrieveURL="subscription/:id"
    storeURL="subscription/"
    updateURL="subscription/:id"
    (headersChanged)="changeHeaders($event)"
></app-form>
