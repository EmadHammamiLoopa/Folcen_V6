<app-header
  [title]="type == 'posted' ? 'My Job Posts' : 'Explore Jobs'"
  [back]="true"
  [backLink]="'/tabs/small-business'"
  [search]="true"
  (searchKeyUp)="search($event)"
></app-header>

<ion-content class="vibrant-dark-theme">
  <div class="mesh-gradient"></div>

  <div class="toggle-container animate__animated animate__fadeIn">
    <div class="glass-toggle">
      <button 
        [class.active]="type == 'available'"
        routerLink="/tabs/small-business/jobs/list/available">
        <i class="fas fa-search"></i> Available
      </button>
      <button 
        [class.active]="type == 'posted'"
        routerLink="/tabs/small-business/jobs/list/posted">
        <i class="fas fa-user-tie"></i> My Posts
      </button>
    </div>
  </div>

  <ion-refresher slot="fixed" pullFactor="0.5" pullMin="100" pullMax="200" (ionRefresh)="getJobs($event, true)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <app-loader *ngIf="pageLoading"></app-loader>

  <!-- Empty State -->
  <div class="empty-state animate__animated animate__fadeIn" *ngIf="jobs && !jobs.length && !pageLoading">
    <div class="empty-icon-wrapper">
      <i class="fas fa-briefcase"></i>
    </div>
    <h3>No Jobs Found</h3>
    <p *ngIf="type == 'posted'">You haven't posted any job opportunities yet. Start by creating your first post!</p>
    <p *ngIf="type == 'available'">We couldn't find any job openings matching your criteria. Check back soon!</p>
    <button class="vibrant-btn" *ngIf="type == 'posted'" (click)="showJobForm()">
      Post a Job
    </button>
  </div>

  <!-- Job Grid -->
  <div class="job-grid" *ngIf="jobs && jobs.length">
    <div class="job-card animate__animated animate__fadeInUp" 
         *ngFor="let job of jobs; let i = index"
         [style.animation-delay]="(i * 0.05) + 's'"
         [routerLink]="['/tabs/small-business/jobs/job/' + job.id]">
      
      <div class="card-image">
        <img [src]="job.photo" alt="Job image">
        <div class="type-badge">{{ job.jobType }}</div>
        <div class="verification-badge" *ngIf="job.isVerified">
          <i class="fas fa-check-circle"></i>
        </div>
      </div>

      <div class="card-content">
        <h3 class="title">{{ job.title }}</h3>
        
        <div class="company-info">
          <div class="company-avatar">
            <i class="fas fa-building"></i>
          </div>
          <span class="company-name">{{ job.company }}</span>
        </div>

        <div class="card-footer">
          <div class="location">
            <i class="fas fa-map-marker-alt"></i>
            <span>{{ job.city }}, {{ job.country }}</span>
          </div>
          <div class="time">
            <i class="far fa-clock"></i>
            <span>{{ job.createdAt | extractDiffTime }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <ion-infinite-scroll threshold="100px" (ionInfinite)="getJobs($event)">
    <ion-infinite-scroll-content loadingSpinner="crescent"></ion-infinite-scroll-content>
  </ion-infinite-scroll>

  <ion-fab slot="fixed" horizontal="end" vertical="bottom" *ngIf="type == 'posted'">
    <ion-fab-button class="vibrant-fab" (click)="showJobForm()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
