<div class="container-fluid">
  <app-table
    [headers]="headers"
    plurarName="jobs"
    singleName="job"
    deleteURL="job/dash/:id"
    retrieveURL="job/all"
    [displayLink]="getDisplayLinkjobs"
    editLink="/dashboard/Jobs/form/edit"
    createLink="/dashboard/Jobs/form/create"
    [showCreateButton]="user.role == 'SUPER ADMIN'"
    [showUpdateButton]="user.role == 'SUPER ADMIN'"
    icon="fas fa-business-time"
  ></app-table>
</div>
