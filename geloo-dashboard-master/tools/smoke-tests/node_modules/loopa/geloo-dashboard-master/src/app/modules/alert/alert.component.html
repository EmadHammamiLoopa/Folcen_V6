<div [class]="'bg-' + color + '-100 border-t-4 border-' + color + '-500 rounded-b text-' + color + '-900 px-4 py-3 shadow-md'" role="alert">
  <div class="flex">
    <div [class]="'py-1 bg-' + color + '-200 flex items-center p-1 ring-1 ring-' + color + '-600 rounded-full w-7 h-7 '">
      <i [class]="'fill-current mx-auto text-' + color + '-500 ' + icon "></i>
    </div>
    <div class="ml-2">
      <p class="font-bold">{{ title }}</p>
      <p class="text-sm">{{ message }}</p>
    </div>
  </div>
</div>
