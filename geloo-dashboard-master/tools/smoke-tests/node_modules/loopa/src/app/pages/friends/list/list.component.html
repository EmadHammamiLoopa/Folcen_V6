<!-- list.component.html -->
<app-friends-header></app-friends-header>

<ion-content class="vibrant-dark-theme">
  <div class="mesh-gradient"></div>

  <div class="friends-container animate__animated animate__fadeIn">
    <app-loader *ngIf="pageLoading"></app-loader>

    <ion-refresher slot="fixed" pullFactor="0.5" pullMin="100" pullMax="200" (ionRefresh)="getFriends($event, true)">
      <ion-refresher-content></ion-refresher-content>
    </ion-refresher>

    <!-- Empty State -->
    <div class="empty-state" *ngIf="(!friends || !friends.length) && !pageLoading">
      <div class="empty-icon">
        <i class="fas fa-user-friends"></i>
      </div>
      <h3>No Friends Yet</h3>
      <p>Start connecting with people to see them here.</p>
      <button class="find-btn" routerLink="/tabs/search">Find People</button>
    </div>

    <!-- Friends List -->
    <div class="friends-list" *ngIf="!pageLoading && friends.length > 0">
      <div class="friend-card glass-card" *ngFor="let friend of friends">
        <div class="friend-info" [routerLink]="['/tabs/profile/display/' + friend._id]">
          <div class="avatar-wrapper">
            <img [src]="friend.getMainAvatar()" alt="Avatar">
            <div class="status-dot" *ngIf="friend.online" class="online"></div>
          </div>
          <div class="friend-details">
            <span class="friend-name">
              {{ friend.fullName }}
              <ng-container *ngIf="friend.getAge(friend === myProfile); let age">
                {{ age !== null ? ', ' + age : '' }}
              </ng-container>
            </span>
            <span class="friend-location">{{ friend.city || 'Unknown Location' }}</span>
          </div>
        </div>
        
        <div class="friend-actions">
          <!-- Missed Messages Indicator -->
          <ng-container *ngIf="missedMap$ | async as missedMap">
            <div class="vibrant-missed-badge" *ngIf="missedMap[friend._id || friend.id]">
              {{ missedMap[friend._id || friend.id] > 99 ? '99+' : missedMap[friend._id || friend.id] }}
            </div>
          </ng-container>

          <button class="action-btn remove" (click)="removeFriend(friend); $event.stopPropagation()">
            <i class="fas fa-user-minus"></i>
          </button>
          <button class="action-btn block" (click)="blockUser(friend); $event.stopPropagation()">
            <i class="fas fa-ban"></i>
          </button>
        </div>
      </div>
    </div>

    <ion-infinite-scroll #infinitScroll threshold="100px" (ionInfinite)="getFriends($event)">
      <ion-infinite-scroll-content loadingSpinner="crescent">
      </ion-infinite-scroll-content>
    </ion-infinite-scroll>
  </div>
</ion-content>
