<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="dismiss()">Cancel</ion-button>
    </ion-buttons>
    <ion-title>{{ title }}</ion-title>
    <ion-buttons slot="end" *ngIf="multiSelect">
      <ion-button (click)="confirm()" color="primary" [disabled]="selectedItems.length === 0">Done</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-searchbar (ionInput)="search($event)" placeholder="Search..."></ion-searchbar>
  
  <div *ngIf="multiSelect && maxSelection > 0" class="ion-padding-horizontal ion-padding-bottom">
    <ion-note color="medium">Selected: {{ selectedItems.length }} / {{ maxSelection }}</ion-note>
  </div>

  <ion-list>
    <ion-item *ngFor="let item of paginatedData" (click)="selectData(item)" [class.selected-item]="isSelected(item)">
      <ion-label>{{ item.name ? item.name : item }}</ion-label>
      <ion-icon *ngIf="isSelected(item)" name="checkmark-circle" slot="end" color="primary"></ion-icon>
    </ion-item>
  </ion-list>
  <ion-infinite-scroll threshold="100px" (ionInfinite)="loadMore($event)">
    <ion-infinite-scroll-content loadingSpinner="bubbles" loadingText="Loading more data..."></ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
