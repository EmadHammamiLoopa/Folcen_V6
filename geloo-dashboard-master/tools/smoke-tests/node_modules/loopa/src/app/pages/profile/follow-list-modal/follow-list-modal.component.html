<ion-header>
  <ion-toolbar>
    <ion-title>{{ type === 'followers' ? 'Followers' : 'Following' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()">Close</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div *ngIf="loading" class="ion-text-center ion-padding">
    <ion-spinner></ion-spinner>
  </div>

  <ion-list *ngIf="!loading">
    <ion-item *ngFor="let user of users">
      <ion-avatar slot="start">
        <img [src]="avatarUrl(user.mainAvatar)" />
      </ion-avatar>
      <ion-label>
        <h2>{{ user.firstName }} {{ user.lastName }}</h2>
        <p>{{ user.profession || 'User' }}</p>
      </ion-label>
      
      <ion-buttons slot="end" *ngIf="isMyProfile">
        <ion-button *ngIf="type === 'following'" color="danger" fill="outline" size="small" (click)="unfollow(user._id)">
          Unfollow
        </ion-button>
        <ion-button *ngIf="type === 'followers'" color="danger" fill="outline" size="small" (click)="removeFollower(user._id)">
          Remove
        </ion-button>
      </ion-buttons>
    </ion-item>

    <div *ngIf="users.length === 0" class="ion-text-center ion-padding">
      <p>No {{ type }} found.</p>
    </div>
  </ion-list>
</ion-content>
