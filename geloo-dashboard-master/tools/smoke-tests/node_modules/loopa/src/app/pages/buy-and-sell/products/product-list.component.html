<app-header
  [back]="true"
  [title]="selectedCategory"
  [backLink]="'/tabs/buy-and-sell/products/buy'"
></app-header>

<app-loader *ngIf="pageLoading"></app-loader>

<ion-content class="vibrant-dark-theme">
  <div class="mesh-gradient"></div>

  <!-- Header Info -->
  <div class="list-header animate__animated animate__fadeIn">
    <h2 class="category-title">{{ selectedCategory }}</h2>
    <p class="product-count" *ngIf="products.length > 0">{{ products.length }} items found</p>
  </div>

  <!-- Empty State -->
  <div *ngIf="!pageLoading && products.length === 0" class="empty-state animate__animated animate__fadeIn">
    <div class="empty-icon-container">
      <ion-icon name="search-outline"></ion-icon>
    </div>
    <h3>No products found</h3>
    <p>Sorry, we couldn't find any products in "<span>{{ selectedCategory }}</span>".</p>
  </div>

  <!-- Product Grid -->
  <div class="product-container">
    <ion-row *ngIf="products && products.length > 0" class="product-grid">
      <ion-col size="6" size-sm="4" size-md="3" *ngFor="let product of products; let i = index"
               class="animate__animated animate__fadeInUp"
               [style.animation-delay]="(i * 0.05) + 's'">
        <div class="product-card" [routerLink]="['/tabs/buy-and-sell/product', product.id]">
          <div class="product-image-container">
            <img [src]="getProductImage(product)" alt="Product Image" loading="lazy">
          </div>
          <div class="product-content">
            <div class="product-meta">
              <span class="product-time">{{ product.createdAt | extractDiffTime }} ago</span>
            </div>
            <h3 class="product-title">{{ product.label | resumeText: 12 }}</h3>
            <div class="product-footer">
              <span class="product-price">{{ product.price }} <small>{{ product.currency }}</small></span>
              <div class="view-btn">
                <ion-icon name="chevron-forward"></ion-icon>
              </div>
            </div>
          </div>
        </div>
      </ion-col>
    </ion-row>
  </div>
</ion-content>
