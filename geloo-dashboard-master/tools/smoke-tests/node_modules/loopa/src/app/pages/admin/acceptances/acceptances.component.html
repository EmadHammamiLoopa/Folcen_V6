<ion-header>
  <ion-toolbar>
    <ion-title>Acceptances</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-item>
    <ion-input placeholder="User ID" [(ngModel)]="userId"></ion-input>
    <ion-button (click)="load()">Load</ion-button>
  </ion-item>

  <ion-list *ngIf="!loading">
    <ion-item *ngFor="let a of acceptances">
      <ion-label>
        <h3>{{a.documentType}} • {{a.documentVersion}}</h3>
        <p>{{a.acceptedAt}} • {{a.acceptanceContext}}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
