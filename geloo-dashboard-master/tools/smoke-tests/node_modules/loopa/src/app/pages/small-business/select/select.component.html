<app-header title="Small Business" [menu]="true" ></app-header>

<ion-content class="dark-content">
  <div class="select-container">
    <div class="image-section">
      <img class="business-svg" src="./../../../../assets/images/svgs/business.svg" alt="Small Business">
    </div>
    
    <div class="content-section">
      <h1 class="welcome-text">Small Business Hub</h1>
      <p class="subtitle">Find opportunities or offer your services</p>

      <div class="options-grid">
        <div class="option-card glass-card" routerLink="/tabs/small-business/jobs">
          <div class="icon-wrapper jobs-icon">
            <i class="fas fa-briefcase"></i>
          </div>
          <h2>Jobs</h2>
          <p>Find your next career move or post a job opening.</p>
          <ion-button fill="clear" class="explore-btn">
            Explore Jobs <i class="fas fa-arrow-right ml-2"></i>
          </ion-button>
        </div>

        <div class="option-card glass-card" routerLink="/tabs/small-business/services">
          <div class="icon-wrapper services-icon">
            <i class="fas fa-tools"></i>
          </div>
          <h2>Services</h2>
          <p>Discover local services or promote your own business.</p>
          <ion-button fill="clear" class="explore-btn">
            Explore Services <i class="fas fa-arrow-right ml-2"></i>
          </ion-button>
        </div>
      </div>
    </div>
  </div>
</ion-content>
