<app-friends-header></app-friends-header>

<ion-content class="vibrant-dark-theme">
  <div class="mesh-gradient"></div>

  <app-loader *ngIf="pageLoading"></app-loader>

  <ion-refresher slot="fixed" pullFactor="0.5" pullMin="100" pullMax="200" (ionRefresh)="getRequests(page, $event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="requests-container">
    <!-- Empty State -->
    <div class="empty-state animate__animated animate__fadeIn" *ngIf="(!requests || !requests.length) && !pageLoading">
      <div class="empty-icon">
        <i class="fas fa-user-plus"></i>
      </div>
      <h3>No Pending Requests</h3>
      <p>When people send you friend requests, they'll appear here.</p>
    </div>

    <!-- Requests List -->
    <div class="requests-list" *ngIf="requests && requests.length > 0">
      <div class="request-card animate__animated animate__fadeInUp" 
           *ngFor="let request of requests; let i = index"
           [style.animation-delay]="(i * 0.1) + 's'">
        
        <div class="request-info">
          <div class="avatar-wrapper">
            <img [src]="request.from.getMainAvatar()" alt="User Avatar">
          </div>
          <div class="request-details">
            <span class="user-name">{{ request.from.fullName }}</span>
            <span class="request-time">{{ request.createdAt | extractDate }}</span>
          </div>
        </div>

        <div class="request-actions">
          <button class="action-btn accept" (click)="acceptRequest(request)">
            <i class="fas fa-check"></i>
            <span>Accept</span>
          </button>
          <button class="action-btn reject" (click)="rejectRequestConf(request)">
            <i class="fas fa-times"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <ion-infinite-scroll #infinitScroll threshold="100px" (ionInfinite)="getRequests(page, $event)">
    <ion-infinite-scroll-content loadingSpinner="crescent"></ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
