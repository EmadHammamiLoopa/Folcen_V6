<app-header [title]="isEditMode ? 'Edit Listing' : 'New Listing'" [back]="true">
  <div id="end-buttons">
    <ion-button (click)="submit()" class="glass-save-btn" [disabled]="form.invalid">
      {{ isEditMode ? 'Update' : 'Publish' }}
    </ion-button>
  </div>
</app-header>

<app-loader *ngIf="pageLoading"></app-loader>

<ion-content class="vibrant-dark-theme">
  <div class="mesh-gradient"></div>

  <div *ngIf="!pageLoading" class="form-container animate__animated animate__fadeIn">
    
    <!-- Progress Bar -->
    <div class="progress-glass-card">
      <div class="progress-header">
        <span>Listing Completion</span>
        <span class="percentage">{{ completionPercentage }}%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" [style.width.%]="completionPercentage"></div>
      </div>
    </div>
    
    <!-- Premium Image Section -->
    <div class="image-section">
      <div class="section-header">
        <h3>Product Photos</h3>
        <p>Add up to 5 high-quality photos</p>
      </div>
      
      <div class="gallery-grid">
        <div *ngFor="let image of productImages; let i = index" class="gallery-item">
          <img *ngIf="image?.url" [src]="image.url" alt="Product">
          <button class="remove-btn" (click)="removeImage(i)">
            <i class="fas fa-times"></i>
          </button>
        </div>
        
        <div class="add-photo-card" (click)="pickImages()" *ngIf="productImages.length < 5">
          <div class="add-content" *ngIf="!imageLoading">
            <div class="icon-circle">
              <i class="fas fa-camera"></i>
            </div>
            <span>Add Photo</span>
          </div>
          <div class="loading-content" *ngIf="imageLoading">
            <ion-spinner name="crescent" color="primary"></ion-spinner>
          </div>
        </div>
      </div>
    </div>

    <form [formGroup]="form" class="vibrant-form">
      <!-- Basic Info Section -->
      <div class="glass-card">
        <div class="card-header">
          <i class="fas fa-info-circle"></i>
          <span>Basic Information</span>
        </div>
        
        <div class="input-group">
          <label>Product Name</label>
          <div class="input-wrapper">
            <i class="fas fa-tag"></i>
            <ion-input formControlName="label" placeholder="What are you selling?"></ion-input>
          </div>
          <div class="error-text" *ngIf="validatorErrors['label'] || (label?.dirty && label?.errors)">
            <span *ngIf="label?.hasError('required')">Name is required</span>
          </div>
        </div>

        <div class="row">
          <div class="col-6">
            <div class="input-group">
              <label>Price</label>
              <div class="input-wrapper">
                <i class="fas fa-dollar-sign"></i>
                <ion-input formControlName="price" type="number" placeholder="0.00"></ion-input>
              </div>
            </div>
          </div>
          <div class="col-6">
            <div class="input-group">
              <label>Currency</label>
              <div class="input-wrapper clickable" (click)="presentCurrenciesModal()">
                <i class="fas fa-coins"></i>
                <span class="value-text">{{ selectedCurrency || 'Select' }}</span>
                <i class="fas fa-chevron-down arrow"></i>
              </div>
            </div>
          </div>
        </div>

        <div class="input-group">
          <label>Category</label>
          <div class="input-wrapper">
            <i class="fas fa-th-large"></i>
            <ion-select formControlName="category" placeholder="Select Category" interface="popover">
              <ion-select-option *ngFor="let category of categories" [value]="category">{{ category }}</ion-select-option>
            </ion-select>
          </div>
        </div>
      </div>

      <!-- Details Section -->
      <div class="glass-card">
        <div class="card-header">
          <i class="fas fa-list-ul"></i>
          <span>Product Details</span>
        </div>

        <div class="row">
          <div class="col-6">
            <div class="input-group">
              <label>Condition</label>
              <div class="input-wrapper">
                <i class="fas fa-star"></i>
                <ion-input formControlName="condition" placeholder="e.g. New"></ion-input>
              </div>
            </div>
          </div>
          <div class="col-6">
            <div class="input-group">
              <label>Stock</label>
              <div class="input-wrapper">
                <i class="fas fa-boxes"></i>
                <ion-input formControlName="stock" type="number" placeholder="1"></ion-input>
              </div>
            </div>
          </div>
        </div>

        <div class="input-group">
          <label>Brand</label>
          <div class="input-wrapper">
            <i class="fas fa-copyright"></i>
            <ion-input formControlName="brand" placeholder="e.g. Apple"></ion-input>
          </div>
        </div>

        <div class="input-group">
          <label>Description</label>
          <div class="textarea-wrapper">
            <ion-textarea formControlName="description" rows="4" placeholder="Describe your product in detail..."></ion-textarea>
          </div>
        </div>
      </div>

      <!-- Location & Specs -->
      <div class="glass-card">
        <div class="card-header">
          <i class="fas fa-truck"></i>
          <span>Location & Shipping</span>
        </div>

        <div class="row">
          <div class="col-6">
            <div class="input-group">
              <label>Country</label>
              <div class="input-wrapper">
                <i class="fas fa-globe"></i>
                <ion-input formControlName="country" placeholder="Country"></ion-input>
              </div>
            </div>
          </div>
          <div class="col-6">
            <div class="input-group">
              <label>City</label>
              <div class="input-wrapper">
                <i class="fas fa-map-marker-alt"></i>
                <ion-input formControlName="city" placeholder="City"></ion-input>
              </div>
            </div>
          </div>
        </div>

        <div class="input-group">
          <label>Weight (kg)</label>
          <div class="input-wrapper">
            <i class="fas fa-weight-hanging"></i>
            <ion-input formControlName="weight" type="number" placeholder="0.0"></ion-input>
          </div>
        </div>

        <div class="dimensions-group" formGroupName="dimensions">
          <label>Dimensions (cm)</label>
          <div class="row">
            <div class="col-4">
              <div class="dim-input">
                <span>L</span>
                <ion-input formControlName="length" type="number"></ion-input>
              </div>
            </div>
            <div class="col-4">
              <div class="dim-input">
                <span>W</span>
                <ion-input formControlName="width" type="number"></ion-input>
              </div>
            </div>
            <div class="col-4">
              <div class="dim-input">
                <span>H</span>
                <ion-input formControlName="height" type="number"></ion-input>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="form-footer">
        <button type="button" class="publish-btn" (click)="submit()" [disabled]="form.invalid || loading">
          <span *ngIf="!loading">{{ isEditMode ? 'Update Listing' : 'Publish Listing' }}</span>
          <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
        </button>
      </div>
    </form>
  </div>
</ion-content>
