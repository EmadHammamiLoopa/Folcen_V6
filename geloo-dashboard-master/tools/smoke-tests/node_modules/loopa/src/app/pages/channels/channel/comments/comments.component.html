<app-header
  [back]="true"
  title="Comments"
></app-header>

<app-loader *ngIf="pageLoading"></app-loader>

<ion-content
  class="d-flex flex-column"
  [style]="{'--background': (pageLoading || !comments || !comments.length) ? '#0f172a' : post.backgroundColor}"
>

  <ion-refresher slot="fixed" pullFactor="0.5" pullMin="100" pullMax="200"  (ionRefresh)="getComments($event, true)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="comments-page-container">

    <div *ngIf="!pageLoading && comments" class="post-header-section">
      <app-post
        [post]="post"
        [user]="user"
        [showCommentsBtn]="false"
      ></app-post>
    </div>

    <div class="empty-comments-state" *ngIf="comments && !comments.length && !pageLoading">
      <div class="empty-card">
        <div class="icon-box">
          <i class="fas fa-comments"></i>
        </div>
        <h3>No voices yet</h3>
        <p>Be the first to start the conversation!</p>
      </div>
    </div>

    <div class="comments-list" *ngIf="comments && comments.length">
      <app-comment
        (removeComment)="onRemoveComment(ind)"
        [backgroundColor]="post.backgroundColor"
        [color]="post.color"
        [comment]="comment"
        [user]="user"
        *ngFor="let comment of comments; let ind = index"
      ></app-comment>
    </div>

  </div>

  <ion-infinite-scroll #infinitScroll threshold="100px" (ionInfinite)="getComments($event)">
    <ion-infinite-scroll-content
      loadingSpinner="crescent"
    >
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>

</ion-content>

<ion-footer class="comment-footer">
  <!-- Media Preview -->
  <div *ngIf="mediaPreview" class="media-preview-container">
    <div class="preview-card">
      <img *ngIf="mediaFile?.type.startsWith('image')" [src]="mediaPreview" alt="media preview" class="preview-img">
      <video *ngIf="mediaFile?.type.startsWith('video')" class="preview-video">
        <source [src]="mediaPreview" type="video/mp4">
      </video>
      <button class="remove-media-btn" (click)="removeMedia()">
        <ion-icon name="close-circle"></ion-icon>
      </button>
    </div>
  </div>

  <div class="input-wrapper">
    <div class="input-actions-left">
      <button class="action-btn camera" (click)="mediaInput.click()">
        <ion-icon name="camera-outline"></ion-icon>
      </button>
    </div>

    <div class="text-input-container">
      <ion-textarea
        [(ngModel)]="commentText"
        placeholder="Write a comment..."
        rows="1"
        autoGrow="true"
        class="comment-textarea"
        (keydown)="onKeyDown($event)"
      ></ion-textarea>
    </div>

    <div class="input-actions-right">
      <button class="send-btn" [disabled]="!commentText && !mediaFile" (click)="storeComment()">
        <ion-icon name="send"></ion-icon>
      </button>
    </div>
  </div>

  <div class="footer-options">
    <div class="option-item">
      <ion-icon name="person-circle-outline"></ion-icon>
      <span>Anonyme</span>
      <ion-toggle color="success" [(ngModel)]="anonyme"></ion-toggle>
    </div>
  </div>

  <!-- Hidden File Input -->
  <input type="file" (change)="onMediaSelected($event)" accept="image/*,video/*" capture="camera" style="display: none;" #mediaInput>
</ion-footer>
