<div class="p-4">
    <div class="flex justify-between items-center mb-4">
        <h1 class="text-2xl font-bold">Plan Rules</h1>
        <a routerLink="/dashboard/subscriptions/rules/form/add" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
            <i class="fas fa-plus mr-2"></i> Add Rule
        </a>
    </div>

    <app-table
        [headers]="headers"
        [retrieveURL]="'subscription/rules'"
        [deleteURL]="'subscription/rules/:id'"
        [displayLink]="getDisplayLink"
    ></app-table>
</div>
