<div class="relative">
  <div class="h-full bg-white py-3 w-72 fixed top-0 left-0 shadow-sm border-r border-gray-100">
    <div class="w-full">
      <div class="flex justify-center items-center gap-3 py-6 border-b border-gray-100 mb-4">
        <img class="w-20 h-20 object-contain" src="./../../../../assets/logo.png" alt="Logo">
        <span class="text-3xl font-bold text-gray-800 tracking-tight">Folcen</span>
      </div>
      <span class="text-left bg-gray-50 text-gray-800 my-4 flex items-center px-4 py-3 mx-2 rounded-xl border border-gray-100" *ngIf="user">
        <img class="w-10 h-10 rounded-full border-2 border-indigo-200" src="./../../../../assets/admin_avatar.png" alt="">
        <span class="ml-3">
          <span class="block font-bold text-sm text-gray-800">{{ user.fullName }}</span>
          <span class="block text-[10px] text-gray-400 uppercase tracking-wider">{{ user.role }}</span>
        </span>
      </span>
    </div>
    <nav class="mt-5 px-2 space-y-1">
      <a [routerLink]="item.path" routerLinkActive="bg-indigo-50 text-indigo-600 font-semibold" *ngFor="let item of menuItems" class="text-gray-500 my-1 py-3 px-4 rounded-xl block hover:bg-gray-50 hover:text-gray-800 transition-all flex items-center group">
        <i [class]="item.icon + ' w-5 text-base group-hover:scale-110 transition-transform'"></i>
        <span class="ml-3 font-medium capitalize">{{ item.name }}</span>
      </a>
      <div class="pt-4 mt-4 border-t border-gray-100">
        <a (click)="signout()" class="text-red-500 cursor-pointer my-1 py-3 px-4 rounded-xl block hover:bg-red-50 hover:text-red-600 transition-all flex items-center group">
          <i class="fas fa-sign-out-alt w-5 text-base group-hover:translate-x-1 transition-transform"></i>
          <span class="ml-3 font-medium capitalize">Signout</span>
        </a>
      </div>
    </nav>
  </div>
</div>
