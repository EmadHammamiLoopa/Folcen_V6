<div class="relative">
  <div class="h-full bg-[#0f172a] py-3 w-72 fixed top-0 left-0 shadow-2xl border-r border-gray-800">
    <div class="w-full">
      <div class="flex justify-center items-center gap-3 py-6 border-b border-gray-800 mb-4">
        <img class="w-20 h-20 object-contain" src="./../../../../assets/logo.png" alt="Logo">
        <span class="text-3xl font-bold text-white tracking-tight">Folcen</span>
      </div>
      <span class="text-left bg-gray-900/50 text-white my-4 flex items-center px-4 py-3 mx-2 rounded-xl border border-gray-800" *ngIf="user">
        <img class="w-10 h-10 rounded-full border-2 border-indigo-500/30" src="./../../../../assets/admin_avatar.png" alt="">
        <span class="ml-3">
          <span class="block font-bold text-sm">{{ user.fullName }}</span>
          <span class="block text-[10px] text-gray-400 uppercase tracking-wider">{{ user.role }}</span>
        </span>
      </span>
    </div>
    <nav class="mt-5 px-2 space-y-1">
      <a [routerLink]="item.path" routerLinkActive="bg-indigo-600 text-white shadow-lg shadow-indigo-500/20" *ngFor="let item of menuItems" class="text-gray-400 my-1 py-3 px-4 rounded-xl block hover:bg-gray-800 hover:text-white transition-all flex items-center group">
        <i [class]="item.icon + ' w-5 text-lg group-hover:scale-110 transition-transform'"></i>
        <span class="ml-3 font-medium capitalize">{{ item.name }}</span>
      </a>
      <div class="pt-4 mt-4 border-t border-gray-800">
        <a (click)="signout()" class="text-red-400 cursor-pointer my-1 py-3 px-4 rounded-xl block hover:bg-red-500/10 hover:text-red-300 transition-all flex items-center group">
          <i class="fas fa-sign-out-alt w-5 text-lg group-hover:translate-x-1 transition-transform"></i>
          <span class="ml-3 font-medium capitalize">Signout</span>
        </a>
      </div>
    </nav>
  </div>
</div>
