<div class="p-6 bg-gray-50 min-h-screen">
  <!-- Header -->
  <div class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-gray-800 flex items-center gap-3">
        <div class="p-2 bg-indigo-100 text-indigo-600 rounded-lg">
          <i class="fas fa-user-edit"></i>
        </div>
        User Management
      </h1>
      <p class="text-gray-500 text-sm mt-1">Create or update user profiles and permissions</p>
    </div>
    
    <a routerLink="/dashboard/Users/list" 
       class="inline-flex items-center gap-2 px-4 py-2 bg-white border border-gray-200 rounded-lg text-gray-600 hover:bg-gray-50 transition-colors text-sm font-medium shadow-sm">
      <i class="fas fa-arrow-left"></i>
      Back to List
    </a>
  </div>

  <!-- Form Container -->
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden max-w-5xl mx-auto">
    <div class="p-6 border-b border-gray-100 bg-gray-50/50">
      <h2 class="font-bold text-gray-700">User Details</h2>
    </div>
    
    <div class="p-8">
      <div class="bg-red-50 border-l-4 border-red-500 text-red-700 p-4 mb-6 rounded-r-lg" *ngIf="error">
        <div class="flex items-center gap-3">
          <i class="fas fa-exclamation-circle"></i>
          <div>
            <p class="font-bold">Server Error</p>
            <p class="text-sm">We encountered an issue while processing your request. Please try again later.</p>
          </div>
        </div>
      </div>

      <app-form
        [headers]="headers"
        [plurarName]="'Users'"
        [singleName]="'user'"
        icon="fas fa-user"
        redirectLink="/dashboard/Users/list"
        retrieveURL="user/dash/edit/:id"
        storeURL="user/"
        updateURL="user/dash/:id"
        (headersChanged)="changeHeaders($event)"
        (onChange)="fieldChanged($event)"
      ></app-form>
    </div>
  </div>
</div>
