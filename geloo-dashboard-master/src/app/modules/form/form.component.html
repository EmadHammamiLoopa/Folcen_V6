<div class="w-full h-full flex justify-center items-center py-12" *ngIf="loading">
  <div class="flex flex-col items-center">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
    <p class="mt-4 text-gray-500 font-medium">Loading form data...</p>
  </div>
</div>

<div class="animate-fadeIn" *ngIf="!loading">
  <div class="bg-red-50 border-l-4 border-red-500 text-red-700 p-4 mb-6 rounded-r-lg" *ngIf="error">
    <p class="font-bold">{{error}}</p>
  </div>

  <form #form="ngForm" (ngSubmit)="type == 'edit' ? updateUser(form.value) : storeUser(form.value)" 
        class="w-full" *ngIf="!loading && (type == 'edit' == !!data) && headers && headers.length">
    
    <div class="flex flex-wrap -mx-3">
      <div *ngFor="let header of headers" class="px-3 mb-5" [class]="header.width ? 'w-' + header.width : 'w-full'">
        
        <!-- Label -->
        <label *ngIf="!header.hidden && header.type != 'checkbox' && header.type != 'avatar' && header.type != 'image'" 
               class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 ml-1" [for]="header.name">
          {{ header.title }}
        </label>

        <section [ngSwitch]="header.type">
          <!-- Avatar / Image Upload -->
          <section *ngSwitchCase="header.type == 'image' || header.type == 'avatar' ? header.type : ''">
            <div class="flex flex-col items-center justify-center p-6 bg-gray-50 rounded-xl border-2 border-dashed border-gray-200 hover:border-indigo-300 transition-colors group">
              <div class="relative">
                <div class="w-32 h-32 rounded-full overflow-hidden ring-4 ring-white shadow-lg bg-white">
                  <img class="w-full h-full object-cover"
                       [src]="imagesUrl[header.name] ? imagesUrl[header.name] : (header.type == 'avatar' ? 'assets/user.jpeg' : 'assets/default-img.png')"
                       alt="Preview" (error)="$any($event.target).src=(header.type == 'avatar' ? 'assets/user.jpeg' : 'assets/default-img.png')">
                </div>
                <label [for]="header.name" 
                       class="absolute bottom-0 right-0 bg-indigo-600 text-white p-2 rounded-full shadow-lg cursor-pointer hover:bg-indigo-700 transition-colors">
                  <i class="fas fa-camera"></i>
                </label>
              </div>
              <p class="mt-3 text-xs text-gray-500 font-medium">Click to upload {{header.title || 'image'}}</p>
              <input (change)="setImage(header, $event)" type="file" [name]="header.name" ngModel [id]="header.name" hidden>
            </div>
          </section>

          <!-- Boolean / Select -->
          <section *ngSwitchCase="'boolean'">
            <div class="relative">
              <select [(ngModel)]="header.value" [id]="header.name" [name]="header.name" [disabled]="header.readonly"
                      class="appearance-none block w-full bg-white border border-gray-200 text-gray-700 rounded-xl py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all disabled:bg-gray-100 disabled:cursor-not-allowed">
                <option [value]="false">{{ (header.values || header.options)[0] }}</option>
                <option [value]="true">{{ (header.values || header.options)[1] }}</option>
              </select>
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400">
                <i class="fas fa-chevron-down text-xs"></i>
              </div>
            </div>
          </section>

          <!-- Checkbox -->
          <section *ngSwitchCase="'checkbox'" class="pt-2">
            <label class="flex items-center cursor-pointer group" [class.opacity-50]="header.readonly" [class.cursor-not-allowed]="header.readonly">
              <div class="relative">
                <input [(ngModel)]="header.value" [name]="header.name" [id]="header.name" type="checkbox" class="sr-only" [disabled]="header.readonly">
                <div class="w-10 h-5 bg-gray-300 rounded-full shadow-inner transition-colors group-hover:bg-gray-400" [class.bg-indigo-500]="header.value"></div>
                <div class="absolute inset-y-0 left-0 w-5 h-5 bg-white rounded-full shadow transform transition-transform" [class.translate-x-5]="header.value"></div>
              </div>
              <span class="ml-3 text-sm font-medium text-gray-700">{{ header.title }}</span>
            </label>
          </section>

          <!-- Select Tags -->
          <section *ngSwitchCase="'select-tags'">
            <div class="flex flex-wrap gap-2 mb-3">
              <span *ngFor="let tag of header.value; let ind = index" 
                    class="inline-flex items-center gap-2 px-3 py-1 bg-indigo-50 text-indigo-600 rounded-lg text-xs font-bold border border-indigo-100">
                {{ tag }}
                <button type="button" (click)="removeTag(header, ind)" class="hover:text-indigo-800">
                  <i class="fas fa-times"></i>
                </button>
              </span>
            </div>
            <div class="relative">
              <select (change)="addTag(header, $event)" [id]="header.name" [name]="header.name"
                      class="appearance-none block w-full bg-white border border-gray-200 text-gray-700 rounded-xl py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all">
                <option value="" disabled selected>Add {{header.title}}...</option>
                <option [value]="option" *ngFor="let option of (header.options || header.values)">{{ option }}</option>
              </select>
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400">
                <i class="fas fa-plus text-xs"></i>
              </div>
            </div>
          </section>

          <!-- Standard Select -->
          <section *ngSwitchCase="'select'">
            <div class="relative">
              <select (change)="fieldChanged(header.name, header.value)" [(ngModel)]="header.value" [id]="header.name" [name]="header.name" [disabled]="header.readonly"
                      class="appearance-none block w-full bg-white border border-gray-200 text-gray-700 rounded-xl py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all disabled:bg-gray-100 disabled:cursor-not-allowed">
                <option [value]="option" *ngFor="let option of (header.options || header.values)">{{ option }}</option>
              </select>
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400">
                <i class="fas fa-chevron-down text-xs"></i>
              </div>
            </div>
          </section>

          <!-- Textarea -->
          <section *ngSwitchCase="'textarea'">
            <textarea [id]="header.name" [name]="header.name" [(ngModel)]="header.value" [placeholder]="header.title" rows="5" [readonly]="header.readonly"
                      class="appearance-none block w-full bg-white border border-gray-200 text-gray-700 rounded-xl py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all readonly:bg-gray-100 readonly:cursor-not-allowed"></textarea>
          </section>

          <!-- Input List -->
          <div *ngSwitchCase="'input-list'" class="space-y-3">
            <div *ngFor="let elem of header.value; let ind = index; trackBy:trackByIndex;" class="flex gap-2">
              <input type="text" [(ngModel)]="header.value[ind]" [id]="header.name + '-' + ind" [name]="header.name + '-' + ind"
                     class="appearance-none block w-full bg-white border border-gray-200 text-gray-700 rounded-xl py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all">
              <button (click)="addElemToList(header, $event)" type="button" *ngIf="ind == header.value.length - 1"
                      class="flex items-center justify-center w-12 bg-indigo-50 text-indigo-600 rounded-xl border border-indigo-100 hover:bg-indigo-100 transition-colors">
                <i class="fas fa-plus"></i>
              </button>
              <button (click)="removeElemFromList(header, ind)" type="button" *ngIf="ind != 0 || header.value.length > 1"
                      class="flex items-center justify-center w-12 bg-red-50 text-red-600 rounded-xl border border-red-100 hover:bg-red-100 transition-colors">
                <i class="fas fa-minus"></i>
              </button>
            </div>
          </div>

          <!-- Default Input (text, email, password, date) -->
          <section *ngSwitchDefault>
            <input *ngIf="!header.hidden" [id]="header.name" [name]="header.name" [(ngModel)]="header.value" [type]="header.type" [placeholder]="header.title" [readonly]="header.readonly"
                   class="appearance-none block w-full bg-white border border-gray-200 text-gray-700 rounded-xl py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all readonly:bg-gray-100 readonly:cursor-not-allowed">
          </section>
        </section>

        <!-- Error Messages -->
        <div class="mt-1 ml-1" *ngIf="errors && errors[header.name]">
          <p class="text-red-500 text-[10px] font-bold uppercase" *ngFor="let err of errors[header.name]">
            <i class="fas fa-exclamation-triangle mr-1"></i> {{ err }}
          </p>
        </div>
      </div>
    </div>

    <!-- Submit Button -->
    <div class="mt-8 pt-6 border-t border-gray-100">
      <button type="submit" [disabled]="saveLoading"
              class="w-full md:w-auto px-8 py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold shadow-lg shadow-indigo-200 transition-all flex items-center justify-center gap-3 disabled:opacity-50 disabled:cursor-not-allowed">
        <i class="fas fa-save" *ngIf="!saveLoading"></i>
        <i class="fas fa-circle-notch fa-spin" *ngIf="saveLoading"></i>
        {{ type == 'edit' ? 'Update User Profile' : 'Create New User' }}
      </button>
    </div>
  </form>
</div>
