<div class="sandglass-backdrop" *ngIf="visible" role="status" aria-live="polite">
  <div class="glass-card">
    <div class="hourglass-wrapper">
      <div class="hourglass">
        <div class="sand-stream"></div>
      </div>
    </div>
    <div class="message">{{message}}</div>
    <div class="loading-dots">
      <span></span><span></span><span></span>
    </div>
  </div>
</div>
