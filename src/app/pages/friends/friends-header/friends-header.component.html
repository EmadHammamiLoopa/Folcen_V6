<app-header title="Social Hub" [menu]="true">
  <div id="end-buttons">
    <div class="header-action-wrapper">
      <ion-button
        fill="clear"
        shape="round"
        routerLink="/tabs/messages"
        class="glass-action-btn"
        aria-label="Open messages"
        title="Messages">
        <ion-icon name="chatbubbles-outline"></ion-icon>
      </ion-button>
      <ng-container *ngIf="(messagesCount$ | async) as m">
        <div class="vibrant-badge" *ngIf="m > 0">{{ m > 99 ? '99+' : m }}</div>
      </ng-container>
    </div>
  </div>
</app-header>

<nav class="social-tabs-container" aria-label="Friends navigation">
  <div class="glass-tabs">
    <div class="tab-item" routerLink="/tabs/friends/list" routerLinkActive="active">
      <span class="tab-icon-shell">
        <ion-icon name="people-outline"></ion-icon>
      </span>
      <span class="tab-label">Friends</span>
    </div>
    
    <div class="tab-item" routerLink="/tabs/friends/requests" routerLinkActive="active">
      <span class="tab-icon-shell request-icon-wrapper">
        <ion-icon name="person-add-outline"></ion-icon>
        <ng-container *ngIf="(friendRequestsCount$ | async) as fr2">
          <span class="dot-badge" *ngIf="fr2 > 0"></span>
        </ng-container>
      </span>
      <span class="tab-label">Requests</span>
      <ng-container *ngIf="(friendRequestsCount$ | async) as fr2">
        <span class="count-pill" *ngIf="fr2 > 0">{{ fr2 > 99 ? '99+' : fr2 }}</span>
      </ng-container>
    </div>
  </div>
</nav>
