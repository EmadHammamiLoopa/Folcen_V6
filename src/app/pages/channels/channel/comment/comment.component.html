<div
  *ngIf="(comment.text && comment.text.trim()) || (mediaUrl && !mediaFailed)"
  [id]="'comment-' + comment.id"
  #cardEl
  class="comment-card"
  [ngClass]="'theme-' + (cardThemeIndex % 6)"
  [class.has-content]="(comment.text && comment.text.trim()) || (mediaUrl && !mediaFailed)"
  [ngStyle]="{
    '--accent': backgroundColor,
    '--text': color,
    '--comment-card-bg': cardBackground,
    '--comment-card-text': cardTextColor,
    '--comment-card-muted': cardMutedColor,
    '--comment-card-control': cardControlBackground
  }"
>
  <div class="card-accent-line"></div>
  
  <div class="card-header">
    <div class="user-info" (click)="showUserProfile(commentUserId)" [style.cursor]="(comment.anonyme || isAdminComment() || !commentUserId) ? 'default' : 'pointer'">
      <div class="avatar-ring" [class.anonyme]="comment.anonyme">
        <div class="avatar-inner" [class.is-anonyme]="comment.anonyme">
          <i *ngIf="comment.anonyme" class="fas fa-user-secret"></i>
          <app-avatar *ngIf="!comment.anonyme" [profile]="commentUser" [size]="38"></app-avatar>
        </div>
      </div>
      <div class="meta">
        <h4 class="username">{{ commentUserName(comment) }}</h4>
        <span class="timestamp">{{ comment.createdAt | extractDiffTime }}</span>
      </div>
    </div>
    
    <button class="btn-more" (click)="presentPopover($event)">
      <i class="fas fa-ellipsis-h"></i>
    </button>
  </div>

  <div class="card-body" *ngIf="(comment.text && comment.text.trim()) || (mediaUrl && !mediaFailed)">
    <p class="comment-text" *ngIf="comment.text && comment.text.trim()">{{ comment.text }}</p>
    
    <div *ngIf="mediaUrl && !mediaFailed" class="media-container" (click)="toggleImageSize()" [class.is-expanded]="isImageEnlarged">
      <div class="media-frame">
        <img [src]="mediaUrl" alt="comment media" class="media-img" (error)="onMediaError()"/>
        
        <div class="expand-hint" *ngIf="!isImageEnlarged">
          <i class="fas fa-expand"></i>
          <span>Tap to view full screen</span>
        </div>

        <div class="close-full-screen" *ngIf="isImageEnlarged">
          <i class="fas fa-times"></i>
        </div>
        
        <div *ngIf="comment.media.expiryDate" class="expiry-overlay">
          <div class="expiry-pill">
            <div class="pulse-dot"></div>
            <span>{{ getTimeRemaining(comment.media.expiryDate) }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card-footer">
    <div class="interaction-group">
      <div class="vote-widget">
        <button type="button" class="vote-btn up" [class.active]="comment.voted === 1" [disabled]="isVoting" (click)="$event.stopPropagation(); voteOnComment(1)">
          <i class="fas fa-chevron-up"></i>
        </button>
        <span class="vote-val">{{ comment.votes }}</span>
        <button type="button" class="vote-btn down" [class.active]="comment.voted === -1" [disabled]="isVoting" (click)="$event.stopPropagation(); voteOnComment(-1)">
          <i class="fas fa-chevron-down"></i>
        </button>
      </div>
    </div>
  </div>
</div>
