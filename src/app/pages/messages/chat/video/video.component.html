<app-loader *ngIf="pageLoading"></app-loader>

<ion-content fullscreen color="dark" class="video-container">

  <div class="call-bg-portrait" *ngIf="!answered && partner">
    <div class="ring">
      <app-avatar [profile]="partner" [size]="168"></app-avatar>
    </div>
    <div class="name">{{ partner?.fullName }}</div>
    <div class="label">{{ answer ? 'Incoming video call' : 'Ringing...' }}</div>
  </div>

  <div class="video-stage" [class.hidden-stage]="!answered">
    <video #partnerVideo id="partner-video" autoplay playsinline
           (click)="swapVideo('my-video')"
           [ngClass]="topVideoFrame === 'partner-video' ? 'main-video' : 'pip-video'">
    </video>

    <video #myVideo id="my-video" autoplay playsinline muted 
           (click)="swapVideo('partner-video')"
           [ngClass]="topVideoFrame === 'my-video' ? 'main-video' : 'pip-video'">
    </video>
  </div>

  <div class="top-overlay" *ngIf="partner && answered">
    <div class="minimal-caller-card">
      <app-avatar [profile]="partner" [size]="60" class="mini-avatar"></app-avatar>
      <div class="info">
        <h3>{{ partner?.fullName }}</h3>
        <span class="status">In Call</span>
      </div>
    </div>
  </div>

  <div class="call-timer-pill" *ngIf="answered">
    <div class="dot"></div>
    <span>{{ callDuration || '00:00' }}</span>
  </div>

  <div class="controls-overlay">
    
    <div class="utility-bar" *ngIf="answered || !answer">
      <button class="blur-btn" [class.active]="!audioEnabled" (click)="toggleAudio()">
        <i class="fas" [ngClass]="audioEnabled ? 'fa-microphone' : 'fa-microphone-slash'"></i>
      </button>
      
      <button class="blur-btn" (click)="toggleCameraDirection()">
        <i class="fas fa-sync-alt" [class.rotating]="switchingCamera"></i>
      </button>

      <button class="blur-btn" [class.active]="!cameraEnabled" (click)="toggleCamera()">
        <i class="fas" [ngClass]="cameraEnabled ? 'fa-video' : 'fa-video-slash'"></i>
      </button>
    </div>

    <div class="action-bar">
      <button *ngIf="answer && !answered" class="main-btn accept" (click)="answerCall()">
        <i class="fas fa-phone"></i>
      </button>

      <button *ngIf="!answered && !answer && !calling" class="main-btn call" (click)="placeCall()">
        <i class="fas fa-video"></i>
      </button>

      <button class="main-btn hangup" (click)="answered ? closeCall() : cancel()">
        <i class="fas fa-phone-slash"></i>
      </button>
    </div>
  </div>

</ion-content>
