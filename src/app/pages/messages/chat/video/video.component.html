<app-loader *ngIf="pageLoading && !answer"></app-loader>

<ion-content fullscreen color="dark" class="video-container">

  <div class="call-bg-portrait" *ngIf="!answered && partner && !autoAnswer">
    <div class="ring">
      <app-avatar [profile]="partner" [size]="168"></app-avatar>
    </div>
    <div class="name">{{ partner?.fullName }}</div>
    <div class="label">{{ answeringCall || (answer && autoAnswer) ? 'Joining call...' : (answer ? 'Incoming video call' : 'Ringing...') }}</div>
  </div>

  <div class="video-stage" [class.hidden-stage]="!answered && !autoAnswer">
    <video #partnerVideo id="partner-video" autoplay playsinline
           (click)="swapVideo('my-video')"
           [ngClass]="topVideoFrame === 'partner-video' ? 'main-video' : 'pip-video'">
    </video>

    <video #myVideo id="my-video" autoplay playsinline muted 
           (click)="swapVideo('partner-video')"
           [ngClass]="topVideoFrame === 'my-video' ? 'main-video' : 'pip-video'">
    </video>
  </div>

  <div class="top-overlay" *ngIf="partner && answered">
    <div class="call-hud">
      <app-avatar [profile]="partner" [size]="60" class="mini-avatar"></app-avatar>
      <div class="info">
        <h3>{{ partner?.fullName }}</h3>
        <span class="status">Video call</span>
      </div>
      <div class="call-timer">
        <span class="live-dot"></span>
        <span>{{ callDuration || '00:00' }}</span>
      </div>
    </div>
  </div>

  <div class="controls-overlay">
    
    <div class="utility-bar" *ngIf="answered || !answer">
      <button class="blur-btn" [class.active]="!audioEnabled" (click)="toggleAudio()" aria-label="Toggle microphone">
        <i class="fas" [ngClass]="audioEnabled ? 'fa-microphone' : 'fa-microphone-slash'"></i>
      </button>
      
      <button class="blur-btn" (click)="toggleCameraDirection()" aria-label="Switch camera">
        <i class="fas fa-sync-alt" [class.rotating]="switchingCamera"></i>
      </button>

      <button class="blur-btn" [class.active]="!cameraEnabled" (click)="toggleCamera()" aria-label="Toggle camera">
        <i class="fas" [ngClass]="cameraEnabled ? 'fa-video' : 'fa-video-slash'"></i>
      </button>
    </div>

    <div class="action-bar">
      <button *ngIf="answer && !answered && !autoAnswer" class="main-btn accept" [disabled]="answeringCall" (click)="answerCall()" aria-label="Answer call">
        <i class="fas" [ngClass]="answeringCall ? 'fa-spinner fa-spin' : 'fa-phone'"></i>
      </button>

      <button *ngIf="!answered && !answer && !calling" class="main-btn call" (click)="placeCall()" aria-label="Start video call">
        <i class="fas fa-video"></i>
      </button>

      <button class="main-btn hangup" (click)="answered ? closeCall() : cancel()" aria-label="End call">
        <i class="fas fa-phone-slash"></i>
      </button>
    </div>
  </div>

</ion-content>
