<ion-header class="ion-no-border">
  <ion-toolbar class="fancy-toolbar">
    <ion-buttons slot="start">
      <ion-button (click)="modalCtrl.dismiss()" class="close-btn">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Filter Discovery</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="mesh-gradient"></div>

  <!-- Gender Selection -->
  <div class="filter-group">
    <div class="group-header">
      <ion-icon name="people-outline"></ion-icon>
      <ion-label>I'm looking for</ion-label>
    </div>
    <ion-segment [(ngModel)]="gender" mode="ios" class="custom-segment">
      <ion-segment-button value="both">
        <ion-label>Any</ion-label>
      </ion-segment-button>
      <ion-segment-button value="male">
        <ion-label>Male</ion-label>
      </ion-segment-button>
      <ion-segment-button value="female">
        <ion-label>Female</ion-label>
      </ion-segment-button>
      <ion-segment-button value="other">
        <ion-label>Other</ion-label>
      </ion-segment-button>
    </ion-segment>
  </div>

  <!-- Age Range -->
  <div class="filter-group">
    <div class="group-header">
      <ion-icon name="calendar-outline"></ion-icon>
      <ion-label>Age Range</ion-label>
    </div>
    <div class="age-container">
      <div class="age-input-wrapper">
        <span>Min</span>
        <ion-input type="number" placeholder="18" [(ngModel)]="minAge" class="custom-input"></ion-input>
      </div>
      <div class="age-divider"></div>
      <div class="age-input-wrapper">
        <span>Max</span>
        <ion-input type="number" placeholder="99" [(ngModel)]="maxAge" class="custom-input"></ion-input>
      </div>
    </div>
  </div>

  <!-- Interests -->
  <div class="filter-group">
    <div class="group-header">
      <ion-icon name="heart-outline"></ion-icon>
      <ion-label>Interests</ion-label>
    </div>
    <div class="chip-container">
      <ion-chip *ngFor="let t of interestsChips; let i = index" (click)="removeInterest(i)" class="custom-chip">
        <ion-label>{{ t }}</ion-label>
        <ion-icon name="close-circle"></ion-icon>
      </ion-chip>
      <ion-button fill="clear" class="add-list-btn" (click)="openInterestsModal()">
        <ion-icon name="add-circle-outline" slot="start"></ion-icon>
        Select from list
      </ion-button>
    </div>
  </div>

  <!-- Languages -->
  <div class="filter-group">
    <div class="group-header">
      <ion-icon name="language-outline"></ion-icon>
      <ion-label>Languages</ion-label>
    </div>
    <div class="chip-container">
      <ion-chip *ngFor="let t of languagesChips; let i = index" (click)="removeLanguage(i)" class="custom-chip">
        <ion-label>{{ t }}</ion-label>
        <ion-icon name="close-circle"></ion-icon>
      </ion-chip>
      <ion-button fill="clear" class="add-list-btn" (click)="openLanguagesModal()">
        <ion-icon name="add-circle-outline" slot="start"></ion-icon>
        Select from list
      </ion-button>
    </div>
  </div>

  <!-- Online Only (Grid Mode) -->
  <div class="filter-group" *ngIf="!isRandomMode">
    <div class="toggle-item">
      <div class="toggle-info">
        <ion-icon name="radio-outline" color="success"></ion-icon>
        <div class="toggle-text">
          <span class="title">Online Only</span>
          <span class="subtitle">Show users currently active</span>
        </div>
      </div>
      <ion-toggle [(ngModel)]="online" mode="ios"></ion-toggle>
    </div>
  </div>

  <!-- Additional Filters (Grid Mode) -->
  <div class="filter-group" *ngIf="!isRandomMode && checkItemsNames && checkItemsNames.length">
    <div class="group-header">
      <ion-icon name="options-outline"></ion-icon>
      <ion-label>Additional Filters</ion-label>
    </div>
    <div class="custom-list">
      <div class="toggle-item" *ngFor="let item of checkItemsNames">
        <div class="toggle-info">
          <div class="toggle-text">
            <span class="title">{{ item | titlecase }}</span>
          </div>
        </div>
        <ion-toggle [(ngModel)]="checkItems[item]" mode="ios"></ion-toggle>
      </div>
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="footer-actions">
    <ion-button (click)="reset()" class="vibrant-btn reset-btn">
      <ion-icon name="refresh-outline" slot="start"></ion-icon>
      Reset
    </ion-button>
    <ion-button (click)="submit()" class="vibrant-btn apply-btn">
      Apply Filters
    </ion-button>
  </div>
</ion-footer>
