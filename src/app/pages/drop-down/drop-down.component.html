<div class="dropdown-container">
  <div class="dropdown-item" *ngFor="let item of items; let last = last" (click)="dismiss(item.event)" [class.last]="last">
    <div class="item-content">
      <div class="icon-box">
        <i [class]="item.icon"></i>
      </div>
      <span class="item-text">{{ item.text }}</span>
    </div>
    <div class="chevron">
      <i class="fas fa-chevron-right"></i>
    </div>
  </div>
</div>
