<app-header title="Login" backLink="/auth/home" [back]="true"></app-header>
<app-loader *ngIf="pageLoading"></app-loader>

<ion-content class="login-content">
    <div class="logo-section">
      <div class="logo-container">
        <img src="assets/images/logo.png" class="infinity-logo" alt="Folcen Logo">
        <div class="logo-text">Folcen</div>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
      <ion-list lines="none" class="bg-transparent">
        <ion-item class="input-item">
          <ion-icon name="mail-outline" slot="start"></ion-icon>
          <ion-input formControlName="email" placeholder="E-mail"></ion-input>
        </ion-item>
        <div class="error-message" *ngIf="(form.get('email')?.invalid && (form.get('email')?.dirty || form.get('email')?.touched)) || validationErrors['email']">
          <span class="d-block text-danger" *ngIf="form.get('email')?.hasError('required')">Email is required.</span>
          <span class="d-block text-danger" *ngIf="form.get('email')?.hasError('email')">Please enter a valid email.</span>
          <span *ngFor="let error of validationErrors['email']">{{ error }}</span>
        </div>

        <ion-item class="input-item">
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input type="password" formControlName="password" placeholder="Password"></ion-input>
        </ion-item>
        <div class="error-message" *ngIf="(form.get('password')?.invalid && (form.get('password')?.dirty || form.get('password')?.touched)) || validationErrors['password']">
          <span class="d-block text-danger" *ngIf="form.get('password')?.hasError('required')">Password is required.</span>
          <span *ngFor="let error of validationErrors['password']">{{ error }}</span>
        </div>

        <div class="forgot-password-row">
          <ion-button fill="clear" size="small" class="forgot-password-btn" (click)="forgotPassword()">
            Forgot password?
          </ion-button>
        </div>

        <ion-button
          type="submit"
          expand="block"
          class="login-btn"
        >
          Login
        </ion-button>

        <div class="register-link-container">
          <span>Don't have an account?</span>
          <ion-button fill="clear" routerLink="/auth/signup" class="register-link">
            Register
          </ion-button>
        </div>
      </ion-list>
    </form>
</ion-content>

<ion-footer class="ion-no-border bg-transparent">
  <ion-button
    expand="block"
    fill="clear"
    color="light"
    class="back-link"
    routerLink="/auth"
  >
    <ion-icon name="chevron-back-outline" slot="start"></ion-icon>
    Back
  </ion-button>
</ion-footer>
