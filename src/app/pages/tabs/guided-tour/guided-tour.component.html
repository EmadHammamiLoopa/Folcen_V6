<div class="tour-root" *ngIf="active">
  <div class="tour-scrim"></div>
  <div class="tour-grain"></div>
  <div class="tour-spotlight" *ngIf="spotlight" [ngStyle]="spotlightStyle"></div>

  <section [class]="cardClass" *ngIf="step">
    <div class="tour-topline">
      <div class="tour-brand">
        <span class="brand-dot"></span>
        <span>Folcen Guide</span>
      </div>
      <div class="tour-meta">
        <span class="step-count">{{ state.index + 1 }} / {{ state.steps.length }}</span>
        <button type="button" class="skip-btn" (click)="skip()">Skip</button>
      </div>
    </div>

    <div class="tour-stage">
      <div class="feature-preview" [ngClass]="visualClass">
        <div class="preview-head">
          <span>{{ demoTitle }}</span>
          <ion-icon [name]="step.icon"></ion-icon>
        </div>
        <div class="preview-cardlet main">
          <span class="avatar-chip"></span>
          <div>
            <strong>{{ chips[0] }}</strong>
            <small>{{ chips[1] || stepLabel }}</small>
          </div>
        </div>
        <div class="preview-rows">
          <span *ngFor="let row of demoRows">{{ row }}</span>
        </div>
      </div>

      <div class="tour-copy">
        <p class="eyebrow">{{ stepLabel }}</p>
        <h2>{{ step.title }}</h2>
        <p class="body">{{ step.body }}</p>
      </div>
    </div>

    <div class="detail-grid">
      <span *ngFor="let item of details">
        <ion-icon name="checkmark-circle"></ion-icon>
        {{ item }}
      </span>
    </div>

    <div class="progress-track">
      <span [style.width.%]="progress"></span>
    </div>

    <div class="tour-actions">
      <ion-button fill="clear" class="back-btn" [disabled]="state.index === 0" (click)="back()">
        Back
      </ion-button>
      <ion-button class="next-btn" (click)="next()">
        {{ primaryText }}
      </ion-button>
    </div>
  </section>
</div>
