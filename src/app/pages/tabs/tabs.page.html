<ion-tabs (ionTabsDidChange)="onTabChanged(($any($event)?.tab) || ($any($event)?.detail?.tab))">
  <ion-tab-bar class="folcen-tab-dock" slot="bottom" *ngIf="shouldShowTabs()">
    <ion-tab-button
      *ngFor="let tab of tabs; trackBy: trackByUrl"
      class="folcen-tab-button"
      [tab]="tab.url"
      [attr.data-tour]="'tab-' + tab.url">

      <span class="tab-icon-shell" aria-hidden="true">
        <i [class]="'icon ' + tab.icon"></i>
      </span>

      <ion-badge *ngIf="getBadgeCount(tab.url) > 0" class="tab-badge">
        {{ getBadgeCount(tab.url) > 99 ? '99+' : getBadgeCount(tab.url) }}
      </ion-badge>

      <ion-badge *ngIf="tab.url === 'profile' && notificationCount > 0" class="tab-badge profile-badge">
        {{ notificationCount > 99 ? '99+' : notificationCount }}
      </ion-badge>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>

<app-guided-tour></app-guided-tour>
