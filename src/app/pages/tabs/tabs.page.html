<!-- IMPORTANT: pass the tab string to avoid TS typing issue -->
<ion-tabs (ionTabsDidChange)="onTabChanged(($any($event)?.tab) || ($any($event)?.detail?.tab))">
  <ion-tab-bar color="light" slot="bottom" *ngIf="showTabs">
    <ion-tab-button *ngFor="let tab of tabs; trackBy: trackByUrl" [tab]="tab.url">
      <i [class]="'icon ' + tab.icon"></i>

      <ion-badge *ngIf="getBadgeCount(tab.url) > 0" color="danger">{{ getBadgeCount(tab.url) }}</ion-badge>

      <!-- Budget Badge (Missed Calls) -->
      <div class="budget-indicator" *ngIf="tab.url === 'feed' && budget > 0 && missedCallsCount > 0">
        {{ budget }}
      </div>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
